name: Bug report
description: Something the app does wrong. Describe the shape of the problem, never the statement.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach a statement**, real or redacted, and never paste its text or a screenshot of
        it. No receipt numbers, phone numbers, names or amounts. Issues are public and stay public.
        Describe the shape instead: "a row whose details wrap onto three lines", "the summary
        total differs by one row".
  - type: checkboxes
    id: no-statement
    attributes:
      label: Privacy
      options:
        - label: This issue holds no statement, screenshot of one, or value read from one.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: The page, the action, and the message the app showed (its wording only).
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: The statement's shape, if it matters
      description: Counts only, such as pages, rows, and whether it has a password. No values.
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 152 on Linux
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: 1.0.0
