[project]
name = "mpesa-core"
version = "0.0.0"
description = "Pure Python core for mpesa-analytics."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license-files = ["LICENSE"]
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpesa_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/guards"]
addopts = "--import-mode=importlib -p no:cacheprovider"
