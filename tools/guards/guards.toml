# Guard configuration. Read from this file only, never from a scanned tree.

[walk]
# Every entry here must also be gitignored (tests/guards/test_gitignore.py).
# Files tracked by git are always checked, even under a pruned location.
prune_names = [
  ".venv", ".vscode", ".cache", "node_modules", "__pycache__",
  ".pytest_cache", ".import_linter_cache", "dist", "build",
]
prune_paths = ["web/public/vendor"]

[patterns]
# Fully matched against the token with spaces, plus signs and hyphens removed.
# Honoured inside fixtures/synthetic/ only. See docs/decisions/0003-fake-ranges.md.
fake_ranges = [
  '254700000\d{3}',
  '07000000\d{2}',
  # Fake receipts: ZZ plus 8 characters.
  'ZZ[A-Z0-9]{8}',
  # Masked fake phones: tail 000 to 099.
  '2547\*{5}0\d{2}',
]
lockfiles = ["uv.lock", "package-lock.json", "pnpm-lock.yaml", "yarn.lock"]

[types]
risky_suffixes = [
  ".csv", ".xlsx", ".xls", ".db", ".sqlite*", ".log", ".env*",
  ".ipynb", ".jsonl", ".dump",
]
# Globs relative to the repo root.
risky_allow = ["fixtures/synthetic/*.csv", "fixtures/synthetic/*.xlsx"]
json_allow_dirs = ["fixtures/synthetic/"]
# Exact paths.
json_allow = ["package.json", "package-lock.json", "web/package.json", "web/package-lock.json"]

[names]
# Enforced by check_banned_names.py; eslint.config.mjs keeps the same lists for JS and TS.
generic = ["data", "result", "temp", "tmp", "info", "item", "obj", "ref", "flag", "res", "ret", "val"]
loop_letters = ["i", "j", "k", "x", "y"]
# Rejected wherever they appear, including calls. See docs/glossary.md.
banned_names = ["import_mpesa_statement"]
# Each exception is scoped to one file:
#   [[names.allow]]
#   name = "..."
#   path = "..."
#   reason = "..."
